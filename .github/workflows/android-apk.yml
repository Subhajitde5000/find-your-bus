# Builds a test APK of the Android app on GitHub, so nothing needs installing on your computer.
#
# Run it: GitHub > Actions > "Build Android test app" > Run workflow.
# Download: open the finished run, scroll to Artifacts, download "cholo-android-debug", unzip it,
# and install app-debug.apk on the phone (allow installs from that source when asked).
#
# This is a DEBUG build for testing only. A Play Store release needs a signed .aab (see mobile/APP.md).
name: Build Android test app

on:
  workflow_dispatch:

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            fontend/package-lock.json
            mobile/package-lock.json

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Install the website packages
        working-directory: fontend
        run: npm ci

      - name: Install the app packages
        working-directory: mobile
        run: npm ci

      - name: Build the website and copy it into the Android project
        working-directory: mobile
        run: npm run sync

      - name: Build the debug APK
        working-directory: mobile/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: cholo-android-debug
          path: mobile/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
